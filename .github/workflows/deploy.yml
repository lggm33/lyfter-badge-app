name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # nunca cortar una migración o un deploy a la mitad

# Explícito para no depender del default del repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyfter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    # Postgres efímero: los tests de integración nunca tocan la DB de Railway.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lyfter_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
      QR_SECRET: ci-only-qr-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Actions fijadas por SHA: un tag se puede mover, un commit no.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, toma la versión de packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # igual que el runtime del proyecto en Vercel
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_hbEFCMIIaBh3aiXnLdqQ9j4A
      VERCEL_PROJECT_ID: prj_6MRbgeqOD0iEZGri1MrEBZAJJNav
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Antes del deploy: el código nuevo nunca arranca contra un schema viejo.
      # Las migraciones deben ser backward-compatible (expand/contract).
      - name: Migrate production DB
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # Build remoto en Vercel: las env vars son sensitive y no se pueden bajar con vercel pull.
      # Token por env (la CLI lo lee sola): nunca en argv ni interpolado en el script.
      - name: Deploy to Vercel
        run: pnpm dlx vercel@59.26.0 deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
